<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Coach</title>
<meta name="description" content="Coach personal de peso, recomposición y gym.">
<meta name="theme-color" content="#F3F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1015" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Coach">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="login" id="login" hidden>
  <form id="loginForm" autocomplete="on">
    <h1>Mi Coach</h1>
    <p class="small ink2" style="margin:0">Entra con tu correo y contraseña.</p>
    <div class="field"><label for="loginEmail">Correo</label><input id="loginEmail" type="email" autocomplete="username" required></div>
    <div class="field"><label for="loginPass">Contraseña</label><input id="loginPass" type="password" autocomplete="current-password" required></div>
    <button class="primary full" style="margin-top:16px" type="submit">Entrar</button>
    <p class="small warn" id="loginMsg" role="status" aria-live="polite"></p>
  </form>
</div>
<div class="app" id="app">
  <header class="top">
    <div class="brand">Mi Coach</div>
    <div class="date" id="hdrDate"></div>
    <button class="iconbtn" id="btnSettings" data-act="openSheet" data-arg="settings" aria-label="Ajustes">⚙︎</button>
  </header>
  <div id="banner" role="status" aria-live="polite"></div>
  <main id="view" tabindex="-1" aria-live="off">
    <div class="card"><div class="skel" style="width:40%"></div><div class="skel"></div><div class="skel" style="width:70%"></div><p class="muted small">Cargando tus datos…</p></div>
  </main>
</div>
<nav class="tabs" aria-label="Secciones"><div class="in" role="tablist">
  <button role="tab" id="tab-hoy" data-act="tab" data-arg="hoy" aria-selected="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hoy</button>
  <button role="tab" id="tab-gym" data-act="tab" data-arg="gym" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>Gym</button>
  <button role="tab" id="tab-progreso" data-act="tab" data-arg="progreso" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Progreso</button>
  <button role="tab" id="tab-chat" data-act="tab" data-arg="chat" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>Chat</button>
</div></nav>
<div id="sheetHost"></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastUndo" class="sm" hidden>Deshacer</button></div>
<input type="file" id="filePick" accept="image/*" capture="environment" class="sr" tabindex="-1" aria-hidden="true">
<input type="file" id="filePickMulti" accept="image/*" multiple class="sr" tabindex="-1" aria-hidden="true">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="calc.js"></script>
<script src="seed.js"></script>
<script src="app.js"></script>
</body>
</html>
