<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b2838">
<title>Gran Premio de Mesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: race track hero (lanes sorted by wins) → log a win → general table → one card per game → recent history */
:root{
  --bg:#f3f1fb; --surface:#ffffff; --ink:#1d1a2e; --muted:#6a6585; --line:#dcd8ec;
  --accent:#e8412f; --accent-ink:#ffffff; --asphalt:#2b2838; --asphalt-2:#353145; --lane-mark:#f6d34a;
  --good:#1f9d63;
  --f-display:"Bungee","Arial Black",system-ui,sans-serif;
  --f-body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14121d; --surface:#1e1b2b; --ink:#f1eefb; --muted:#a39dbd; --line:#332f45;
  --accent:#ff5a46; --accent-ink:#ffffff; --asphalt:#0d0b14; --asphalt-2:#17141f; --lane-mark:#e5c23c; --good:#3cc286; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14121d; --surface:#1e1b2b; --ink:#f1eefb; --muted:#a39dbd; --line:#332f45;
  --accent:#ff5a46; --accent-ink:#ffffff; --asphalt:#0d0b14; --asphalt-2:#17141f; --lane-mark:#e5c23c; --good:#3cc286; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:grid;gap:28px}
h1,h2{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(26px,5vw,40px);line-height:1.05}
h2{font-size:20px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
header.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.status{font-size:13px;color:var(--muted)}

/* Race */
.race{background:var(--asphalt);border-radius:18px;padding:14px 14px 16px;color:#fff;position:relative;overflow:hidden}
.race-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 4px 10px;flex-wrap:wrap}
.race-head .eyebrow{color:#cfc9e6}
.ticker{min-height:44px;display:flex;align-items:center;gap:10px;background:var(--asphalt-2);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-weight:500}
.ticker b{color:var(--lane-mark);font-weight:700}
.ticker.flash{animation:flash 1.6s ease}
@keyframes flash{0%{background:var(--lane-mark);color:#1d1a2e}30%{background:var(--lane-mark);color:#1d1a2e}100%{background:var(--asphalt-2);color:#fff}}
.ticker.flash b{color:inherit}
.track{position:relative}
.lane{position:absolute;left:0;right:0;height:var(--laneH);transition:top .9s cubic-bezier(.3,.9,.3,1)}
.lane-bg{position:absolute;inset:6px 0;border-radius:10px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 22px,transparent 22px 44px);background-size:44px 100%;animation:road .6s linear infinite}
@keyframes road{to{background-position:-44px 0}}
.lane::after{content:"";position:absolute;left:0;right:0;bottom:0;border-bottom:2px dashed rgba(246,211,74,.35)}
.lane:last-child::after{display:none}
.finish{position:absolute;top:6px;bottom:6px;right:0;width:14px;background:conic-gradient(#fff 25%,#111 0 50%,#fff 0 75%,#111 0) 0 0/7px 7px;border-radius:0 6px 6px 0}
.pos{position:absolute;left:4px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:13px;background:rgba(255,255,255,.1);color:#fff}
.lane[data-rank="1"] .pos{background:#f6c445;color:#2b2010}
.lane[data-rank="2"] .pos{background:#c9cdd6;color:#22252b}
.lane[data-rank="3"] .pos{background:#d08a4e;color:#2a1608}
.road{position:absolute;left:42px;right:20px;top:0;bottom:0}
.kart{position:absolute;bottom:8px;width:var(--kartW);transition:left 1.6s cubic-bezier(.22,.9,.28,1.08)}
.kart .body{position:relative;animation:bob .35s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-2px)}}
.kart svg{display:block;width:100%;height:auto;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
.kart .head{transform-box:fill-box;transform-origin:50% 100%;animation:wobble .7s ease-in-out infinite alternate}
@keyframes wobble{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.kart .wheel{transform-box:fill-box;transform-origin:center;animation:spin .4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.kart .name{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:2px;white-space:nowrap;font-weight:700;font-size:12px;background:rgba(0,0,0,.55);padding:1px 7px;border-radius:999px}
.kart .wins{position:absolute;right:-6px;top:-4px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--lane-mark);color:#1d1a2e;font-family:var(--f-display);font-size:13px;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.kart .crown{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-16px);width:22px;display:none;animation:crown 1.2s ease-in-out infinite alternate}
.lane[data-rank="1"][data-lead="1"] .kart .crown{display:block}
@keyframes crown{to{transform:translate(-50%,-19px) rotate(6deg)}}
.kart .smoke{position:absolute;left:-10px;bottom:6px;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.35);animation:smoke .7s linear infinite}
.kart .smoke.s2{animation-delay:.35s}
@keyframes smoke{from{transform:translate(0,0) scale(.6);opacity:.8}to{transform:translate(-22px,-8px) scale(1.6);opacity:0}}
.kart .fire{position:absolute;left:-26px;bottom:6px;width:28px;height:14px;display:none;background:radial-gradient(ellipse at right,#fff6 0,#ffd23a 30%,#ff6a1a 60%,transparent 70%);border-radius:50%;animation:fire .12s linear infinite alternate}
@keyframes fire{to{transform:scaleX(1.3)}}
.kart.boost .fire{display:block}
.kart.boost .body{animation:wheelie .5s ease 3}
@keyframes wheelie{0%,100%{transform:rotate(0)}40%{transform:rotate(-8deg) translateX(4px)}}
.lights{position:absolute;inset:0;display:grid;place-items:center;z-index:5;pointer-events:none}
.lights span{font-family:var(--f-display);font-size:clamp(40px,12vw,84px);color:#fff;text-shadow:0 4px 0 #000;animation:pop .5s ease both}
.lights span.go{color:var(--lane-mark)}
@keyframes pop{from{transform:scale(2.2);opacity:0}to{transform:scale(1);opacity:1}}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.race-empty{padding:30px 10px;text-align:center;color:#cfc9e6}

/* Panels */
.panel{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:500 14px var(--f-body);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip .dot{width:12px;height:12px;border-radius:50%;flex:none}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.chip:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{appearance:none;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:700 16px var(--f-body);padding:12px 20px;cursor:pointer}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500;font-size:14px;padding:8px 12px}
.btn.small{font-size:13px;padding:6px 10px;border-radius:8px}
.log-grid{display:grid;gap:14px}
.log-row{display:grid;gap:8px}
.note{font-size:13px;color:var(--muted)}
.note.err{color:var(--accent)}

/* Tables */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;white-space:nowrap}
td.name,th.name{text-align:left}
td.total{font-family:var(--f-display);font-size:18px}
td.zero{color:var(--muted)}
td.best{font-weight:700;color:var(--good)}
.who{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.game h3{margin:0 0 10px;font:700 16px var(--f-body);display:flex;justify-content:space-between;gap:8px}
.game h3 .num{color:var(--muted);font-weight:500;font-size:13px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:8px;align-items:center;padding:5px 0}
.bar-label{display:flex;justify-content:space-between;gap:6px;font-size:14px;min-width:0}
.bar-label span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:4px;transition:width .8s ease}
.bar-row .num{text-align:right;font-weight:700}
.history{list-style:none;margin:0;padding:0;display:grid}
.history li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.history li:last-child{border-bottom:0}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.setup{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.setup input{font:15px var(--f-body);padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0;flex:1 1 180px}
details summary{cursor:pointer;font-weight:700}
@media (prefers-reduced-motion: reduce){.lane,.kart,.bar i{transition:none}.lane-bg,.kart .body,.kart .head,.kart .wheel,.kart .smoke,.kart .crown,.ticker.flash,.lights span{animation:none}}
@media (max-width:560px){.road{left:38px;right:16px}.pos{width:26px;height:26px;font-size:12px}.kart .name{font-size:11px}}
body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Noches de juegos de mesa</div>
      <h1>Gran Premio de Mesa</h1>
    </div>
    <div class="status" id="status" aria-live="polite">Conectando…</div>
  </header>

  <section class="race" aria-labelledby="race-title">
    <div class="race-head">
      <h2 id="race-title">La carrera</h2>
      <span class="eyebrow">Cada victoria avanza una casilla · <span id="meta">Meta: 30 victorias</span></span>
    </div>
    <div class="ticker" id="ticker" aria-live="polite">Todavía no hay victorias. La primera que se anote aparece aquí.</div>
    <div class="track" id="track"></div>
    <canvas id="confetti" aria-hidden="true"></canvas>
  </section>

  <section class="panel" aria-labelledby="gen-title">
    <h2 id="gen-title">Tabla general</h2>
    <div class="card scroll"><table id="general"></table></div>
  </section>

  <section class="panel" aria-labelledby="games-title">
    <h2 id="games-title">Por juego</h2>
    <div class="games" id="games"></div>
  </section>

  <section class="panel" aria-labelledby="hist-title">
    <h2 id="hist-title">Últimas victorias</h2>
    <div class="card"><ul class="history" id="history"></ul></div>
  </section>

  </div>

<script>
const COLORS=["#e8412f","#2f7de8","#22a55b","#f2b81f","#8e4ae0","#f07a1a","#1fb8c4","#e04a9a"];
const DEFAULT_GAMES=[{id:"uno",name:"UNO"},{id:"rummy",name:"Rummy"},{id:"ticket",name:"Ticket to Ride"},{id:"catan",name:"Catan"},{id:"monopoly",name:"Monopoly"},{id:"life",name:"Life"},{id:"golf",name:"Golf (Netflix)"}];
const LANE_H=64;
const S={players:[],games:DEFAULT_GAMES,wins:[],pickP:null,pickG:null,canWrite:null,db:null,confirmDel:null,loaded:false,initialDone:false};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function kartSVG(color,initial,photo,uid){
  return `<svg viewBox="0 -18 120 82" aria-hidden="true">
  <path d="M6 44 L16 30 L48 27 L58 16 L80 16 L90 28 L112 32 L116 44 Q60 50 6 44 Z" fill="${color}"/>
  <path d="M16 30 L48 27 L54 38 L12 40 Z" fill="rgba(0,0,0,.2)"/>
  <path d="M90 28 L112 32 L114 38 L92 36 Z" fill="rgba(255,255,255,.35)"/>
  <rect x="98" y="20" width="18" height="6" rx="2" fill="#222"/><rect x="104" y="24" width="3" height="8" fill="#222"/>
  <rect x="0" y="22" width="14" height="5" rx="2" fill="#222"/>
  ${photo?`<g class="head"><defs><clipPath id="hc-${uid}"><circle cx="66" cy="2" r="18"/></clipPath></defs>
  <circle cx="66" cy="2" r="20" fill="${color}"/>
  <image href="${esc(photo)}" x="48" y="-16" width="36" height="36" clip-path="url(#hc-${uid})" preserveAspectRatio="xMidYMid slice"/>
  <circle cx="66" cy="2" r="18" fill="none" stroke="#fff" stroke-width="2"/></g>`:`<circle cx="68" cy="11" r="11" fill="${color}" stroke="#fff" stroke-width="2.5"/>
  <path d="M69 5 h9 a5 5 0 0 1 0 10 h-9 z" fill="#1d1a2e"/>
  <text x="64" y="15" font-family="Bungee,Arial Black,sans-serif" font-size="11" fill="#fff" text-anchor="middle">${esc(initial)}</text>`}
  <g class="wheel"><circle cx="26" cy="49" r="13" fill="#1a1a1a"/><circle cx="26" cy="49" r="6" fill="#ccc"/><rect x="24.5" y="38" width="3" height="22" fill="#555"/><rect x="15" y="47.5" width="22" height="3" fill="#555"/></g>
  <g class="wheel"><circle cx="96" cy="49" r="13" fill="#1a1a1a"/><circle cx="96" cy="49" r="6" fill="#ccc"/><rect x="94.5" y="38" width="3" height="22" fill="#555"/><rect x="85" y="47.5" width="22" height="3" fill="#555"/></g>
  </svg>`;
}
const CROWN='<svg class="crown" viewBox="0 0 24 16" aria-hidden="true"><path d="M2 14 L4 4 L9 9 L12 2 L15 9 L20 4 L22 14 Z" fill="#f6c445" stroke="#7a5a10" stroke-width="1.2"/></svg>';
const pById=id=>S.players.find(p=>p.id===id);
const gById=id=>S.games.find(g=>g.id===id);
function counts(){
  const tot={},per={};
  for(const p of S.players){tot[p.id]=0;per[p.id]={};for(const g of S.games)per[p.id][g.id]=0;}
  for(const w of S.wins){if(tot[w.player]==null)continue;tot[w.player]++;if(per[w.player][w.game]!=null)per[w.player][w.game]++;}
  return {tot,per};
}
function ranking(){
  const {tot}=counts();
  return S.players.slice().sort((a,b)=>(tot[b.id]-tot[a.id])||a.name.localeCompare(b.name));
}

let raceStarted=false;
function renderRace(){
  const track=$("track"); const {tot}=counts(); const order=ranking();
  if(!S.players.length){track.style.height="auto";track.innerHTML=`<div class="race-empty">Todavía no hay jugadores.</div>`;return;}
  track.querySelectorAll(".race-empty").forEach(e=>e.remove());
  const narrow=track.clientWidth<560, laneH=narrow?74:82, kartW=narrow?62:86;
  track.style.setProperty("--laneH",laneH+"px"); track.style.setProperty("--kartW",kartW+"px");
  const lead=Math.max(0,...order.map(p=>tot[p.id]));
  const max=Math.max(30,Math.ceil((lead+8)/10)*10);
  const meta=document.getElementById("meta"); if(meta)meta.textContent="Meta: "+max+" victorias";
  track.style.height=(order.length*laneH)+"px";
  const keep=new Set(); const topWins=tot[order[0].id], soloLead=order.length<2||tot[order[1].id]<topWins;
  order.forEach((p,i)=>{
    keep.add(p.id);
    let lane=track.querySelector(`.lane[data-p="${p.id}"]`);
    if(!lane){lane=document.createElement("div");lane.className="lane";lane.dataset.p=p.id;
      lane.innerHTML=`<div class="lane-bg"></div><div class="finish"></div><div class="pos"></div><div class="road"><div class="kart" style="left:0px"><div class="body"><span class="smoke"></span><span class="smoke s2"></span><span class="fire"></span><div class="art"></div>${CROWN}<span class="name"></span><span class="wins"></span></div></div></div>`;
      lane.style.top=(i*laneH)+"px";track.appendChild(lane);}
    lane.style.top=(i*laneH)+"px"; lane.dataset.rank=i+1; lane.dataset.lead=(i===0&&topWins>0&&soloLead)?"1":"0";
    lane.querySelector(".pos").textContent=(i+1)+"°";
    const kart=lane.querySelector(".kart"), w=tot[p.id];
    const art=lane.querySelector(".art"); const sig=p.color+"|"+(p.photo||"");if(art.dataset.c!==sig){art.innerHTML=kartSVG(p.color,(p.name||"?")[0].toUpperCase(),p.photo,p.id);art.dataset.c=sig;}
    lane.querySelector(".name").textContent=p.name; lane.querySelector(".wins").textContent=w;
    kart.setAttribute("aria-label",`${p.name}: ${w} victorias, puesto ${i+1}`);
    kart.dataset.target=`calc(${w/max} * (100% - ${kartW}px))`;
    if(raceStarted)kart.style.left=kart.dataset.target;
  });
  track.querySelectorAll(".lane").forEach(l=>{if(!keep.has(l.dataset.p))l.remove();});
}
function startRace(){
  if(raceStarted)return; const race=document.querySelector(".race");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const go=()=>{raceStarted=true;document.querySelectorAll(".kart").forEach(k=>{if(k.dataset.target)k.style.left=k.dataset.target;});};
  if(reduce){go();return;}
  const box=document.createElement("div");box.className="lights";race.appendChild(box);
  const steps=["3","2","1","¡YA!"];let i=0;
  const tick=()=>{if(i<steps.length){box.innerHTML=`<span class="${i===3?"go":""}">${steps[i]}</span>`;if(i===3)go();i++;setTimeout(tick,i===4?700:600);}else box.remove();};
  tick();
}
function confetti(x,y){
  const c=$("confetti"),race=document.querySelector(".race");if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const r=race.getBoundingClientRect();c.width=r.width;c.height=r.height;const ctx=c.getContext("2d");
  const cols=["#f6d34a","#e8412f","#2f7de8","#22a55b","#ffffff","#8e4ae0"];
  const ps=Array.from({length:90},()=>({x,y,vx:(Math.random()-.5)*9,vy:-Math.random()*9-3,s:4+Math.random()*5,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6,vr:(Math.random()-.5)*.4}));
  let t=0;const step=()=>{ctx.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.28;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();});if(++t<110)requestAnimationFrame(step);else ctx.clearRect(0,0,c.width,c.height);};step();
}
function renderGeneral(){
  const {tot,per}=counts(); const order=ranking();
  if(!order.length){$("general").innerHTML=`<tr><td class="muted">Sin jugadores todavía.</td></tr>`;return;}
  const bestPer={};for(const g of S.games)bestPer[g.id]=Math.max(0,...order.map(p=>per[p.id][g.id]));
  let h=`<thead><tr><th>#</th><th class="name">Jugador</th><th>Total</th>${S.games.map(g=>`<th>${esc(g.name)}</th>`).join("")}</tr></thead><tbody>`;
  order.forEach((p,i)=>{
    h+=`<tr><td class="num">${i+1}</td><td class="name"><span class="who"><span class="chip dot" style="background:${p.color};padding:0;border:0"></span>${esc(p.name)}</span></td><td class="total">${tot[p.id]}</td>`+
      S.games.map(g=>{const v=per[p.id][g.id];return `<td class="${v===0?"zero":(v===bestPer[g.id]?"best":"")}">${v}</td>`}).join("")+`</tr>`;
  });
  $("general").innerHTML=h+"</tbody>";
}

function renderGames(){
  const {per}=counts();
  $("games").innerHTML=S.games.map(g=>{
    const rows=S.players.map(p=>({p,v:per[p.id]?.[g.id]||0})).sort((a,b)=>b.v-a.v||a.p.name.localeCompare(b.p.name));
    const total=rows.reduce((s,r)=>s+r.v,0), max=Math.max(1,...rows.map(r=>r.v));
    const leader=rows[0]&&rows[0].v>0&&(!rows[1]||rows[1].v<rows[0].v)?rows[0].p.name:null;
    return `<div class="card game"><h3>${esc(g.name)} <span class="num">${total} ${total===1?"partida":"partidas"}</span></h3>
      <div class="note" style="margin:-6px 0 6px">${leader?`Manda ${esc(leader)}`:(total?"Empate arriba":"Nadie ha ganado aún")}</div>
      ${rows.map(r=>`<div class="bar-row"><div><div class="bar-label"><span>${esc(r.p.name)}</span></div><div class="bar"><i style="width:${r.v/max*100}%;background:${r.p.color}"></i></div></div><span class="num">${r.v}</span></div>`).join("")||`<span class="note">Sin jugadores.</span>`}
    </div>`;
  }).join("");
}

function fmtWhen(iso){try{const d=new Date(iso);return d.toLocaleDateString("es",{day:"numeric",month:"short"})+" · "+d.toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"});}catch(e){return ""}}
function renderHistory(){
  const list=S.wins.slice().sort((a,b)=>(b.at||"").localeCompare(a.at||"")).slice(0,12);
  if(!list.length){$("history").innerHTML=`<li class="muted">Aquí aparece cada victoria que anoten.</li>`;return;}
  $("history").innerHTML=list.map(w=>{const p=pById(w.player),g=gById(w.game);
    const del="";
    return `<li><span><span class="who"><span class="chip dot" style="background:${p?.color||"#999"};padding:0;border:0"></span>${esc(p?.name||"Jugador borrado")}</span> ganó <b>${esc(g?.name||w.game)}</b> <span class="note">${fmtWhen(w.at)}</span></span>${del}</li>`}).join("");
}
function renderAll(){renderRace();renderGeneral();renderGames();renderHistory();}

function announce(w){
  const p=pById(w.player),g=gById(w.game); if(!p)return;
  const {tot,per}=counts();
  const t=$("ticker");
  t.innerHTML=`🏁 <span><b>${esc(p.name)}</b> sumó una victoria en <b>${esc(g?.name||w.game)}</b>: ya lleva ${per[p.id]?.[w.game]||0} en ese juego y ${tot[p.id]} en total.</span>`;
  t.classList.remove("flash");void t.offsetWidth;t.classList.add("flash");
  const k=document.querySelector(`.lane[data-p="${w.player}"] .kart`);
  if(k){k.classList.remove("boost");void k.offsetWidth;k.classList.add("boost");setTimeout(()=>k.classList.remove("boost"),2200);setTimeout(()=>{const rr=document.querySelector(".race").getBoundingClientRect(),kr=k.getBoundingClientRect();confetti(kr.left-rr.left+kr.width/2,kr.top-rr.top);},900);}
}
function lastLine(){
  const w=S.wins.slice().sort((a,b)=>(b.at||"").localeCompare(a.at||""))[0];
  if(!w){$("ticker").textContent="Todavía no hay victorias. Anoten la primera abajo.";return;}
  const p=pById(w.player),g=gById(w.game); if(!p)return;
  $("ticker").innerHTML=`<span>Última: <b>${esc(p.name)}</b> ganó en <b>${esc(g?.name||w.game)}</b> · ${fmtWhen(w.at)}</span>`;
}

renderAll();
let lastCount=null;
async function load(){
  try{
    const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok)throw 0; const d=await r.json();
    S.players=d.players||[]; S.games=d.games&&d.games.length?d.games:DEFAULT_GAMES;
    S.wins=(d.wins||[]).map((w,i)=>({id:String(i),...w}));
    renderAll();
    if(lastCount!==null&&S.wins.length>lastCount){const nw=S.wins.slice(lastCount).sort((a,b)=>(b.at||'').localeCompare(a.at||''));setTimeout(()=>announce(nw[0]),300);}
    else if(lastCount===null){lastLine();setTimeout(startRace,250);}
    lastCount=S.wins.length;
    $('status').textContent='En vivo · '+S.wins.length+' victorias · se actualiza solo';
  }catch(e){$('status').textContent='Sin conexión, reintentando…';}
}
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(renderRace,150);});
load(); setInterval(()=>{if(!document.hidden)load();},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load();});
</script>
</body>
</html>
